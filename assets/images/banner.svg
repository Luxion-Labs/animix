<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="anim-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070D" />
      <stop offset="50%" stop-color="#091524" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="turq-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <radialGradient id="pixel-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#04070D" stop-opacity="0" />
    </radialGradient>
    <pattern id="pixel-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#anim-bg)" />
  <rect width="1200" height="420" fill="url(#pixel-glow)" />
  <rect width="1200" height="420" fill="url(#pixel-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2" />

  <!-- 2D Sprite Timeline / Animation Frame Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Spritesheet Filmstrip Container -->
    <rect x="-140" y="-85" width="280" height="170" rx="8" fill="#091424" stroke="#06B6D4" stroke-width="2" />
    
    <!-- Filmstrip Perforation Holes (Top & Bottom) -->
    <g fill="#040810">
      <rect x="-130" y="-80" width="12" height="8" rx="2" />
      <rect x="-95" y="-80" width="12" height="8" rx="2" />
      <rect x="-60" y="-80" width="12" height="8" rx="2" />
      <rect x="-25" y="-80" width="12" height="8" rx="2" />
      <rect x="10" y="-80" width="12" height="8" rx="2" />
      <rect x="45" y="-80" width="12" height="8" rx="2" />
      <rect x="80" y="-80" width="12" height="8" rx="2" />
      <rect x="115" y="-80" width="12" height="8" rx="2" />

      <rect x="-130" y="72" width="12" height="8" rx="2" />
      <rect x="-95" y="72" width="12" height="8" rx="2" />
      <rect x="-60" y="72" width="12" height="8" rx="2" />
      <rect x="-25" y="72" width="12" height="8" rx="2" />
      <rect x="10" y="72" width="12" height="8" rx="2" />
      <rect x="45" y="72" width="12" height="8" rx="2" />
      <rect x="80" y="72" width="12" height="8" rx="2" />
      <rect x="115" y="72" width="12" height="8" rx="2" />
    </g>

    <!-- 3 Animated Sprite Frames -->
    <!-- Frame 1 -->
    <g transform="translate(-85, 0)">
      <rect x="-35" y="-55" width="70" height="110" fill="#0E2038" stroke="#06B6D4" stroke-width="1" />
      <circle cx="0" cy="-20" r="12" fill="#FACC15" />
      <rect x="-6" y="-6" width="12" height="26" rx="2" fill="#38BDF8" />
      <line x1="-6" y1="20" x2="-14" y2="40" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
      <line x1="6" y1="20" x2="14" y2="40" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="50" fill="#64748B" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">FRM_01</text>
    </g>

    <!-- Frame 2 (Active/Current Frame) -->
    <g transform="translate(0, 0)">
      <rect x="-35" y="-55" width="70" height="110" fill="#142B4D" stroke="#FACC15" stroke-width="2" />
      <circle cx="0" cy="-22" r="12" fill="#FACC15" />
      <rect x="-6" y="-8" width="12" height="26" rx="2" fill="#FACC15" />
      <line x1="-6" y1="18" x2="-2" y2="38" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
      <line x1="6" y1="18" x2="18" y2="34" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="50" fill="#FACC15" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">ACTIVE (24 FPS)</text>
    </g>

    <!-- Frame 3 -->
    <g transform="translate(85, 0)">
      <rect x="-35" y="-55" width="70" height="110" fill="#0E2038" stroke="#06B6D4" stroke-width="1" />
      <circle cx="0" cy="-20" r="12" fill="#FACC15" />
      <rect x="-6" y="-6" width="12" height="26" rx="2" fill="#38BDF8" />
      <line x1="-6" y1="20" x2="-18" y2="36" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
      <line x1="6" y1="20" x2="6" y2="40" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="50" fill="#64748B" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle">FRM_03</text>
    </g>

    <text x="0" y="115" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">SPRITESHEET: ONION SKINNING PIPELINE</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="250" height="30" rx="15" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#06B6D4" />
    <text x="28" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">2D SPRITE &amp; ANIMATION WORKBENCH</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Animix
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#turq-yellow)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      2D sprite animation and spritesheet generation workbench for modern interactive web applications.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Generate production-ready 2D assets, animations, and interactive scene flows with Gemini AI.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">CANVAS: HTML5 + WEBGL</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">AI: GEMINI SPRITES</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>